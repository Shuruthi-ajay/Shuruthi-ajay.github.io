<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" type="image/x-icon" href="chef.png">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
     <h3> LOGIN </h3>
        <form id="login">
            <input type="text" placeholder="Username" required>
            <input type="password" placeholder="Password" required>
            <br><br>
            <button id="loginButton()" onclick="gotohome()">Login</button>
            <p>Don't have an account?</p>
            <button id="signup1" onclick="gotosign()">Sign Up</button>
        </form>
    </div>
    <script>

        function gotohome(){
            window.location.href = "open_page.html";
        }

        function gotosign(){
            window.location.href = "signup_page.html";
        }
    </script>
</body>
</html>
